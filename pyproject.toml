[project]
name = "uk-solar-siting"
version = "0.1.0"
description = "XGBoost-based solar site suitability prediction for the UK"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "geopandas>=0.14",
    "shapely>=2.0",
    "numpy>=1.24",
    "rasterio>=1.3",
    "xarray>=2023.1",
    "netCDF4>=1.6",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "matplotlib>=3.7",
    "folium>=0.15",
    "pyyaml>=6.0",
    "requests>=2.31",
    "tqdm>=4.66",
    "pyproj>=3.6",
    "streamlit>=1.30",
    "plotly>=5.18",
    "streamlit-folium>=0.18",
]

[project.optional-dependencies]
dev = ["jupyter", "black", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"
